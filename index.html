<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoodPicker ITF</title>

  <!-- ฟอนต์ไทยจาก Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- ไฟล์สไตล์ -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== Navbar ด้านบนสุด ===== -->
  <nav class="navbar">
    <span class="nav-left">69070050</span>
    <span class="nav-center">FOODPICKER ITF</span>
    <span class="nav-right">week15</span>
  </nav>

  <!-- ===== การ์ดแสดงเมนูอาหาร ===== -->
  <main class="container">
    <section class="card" id="foodCard">
      <!-- รูปอาหาร -->
      <div class="image-box">
        <img id="foodImage" src="" alt="รูปเมนูอาหาร" />
      </div>

      <!-- ชื่อเมนู -->
      <h1 class="food-name" id="foodName"></h1>

      <!-- คำอธิบายเมนู -->
      <p class="food-desc" id="foodDesc"></p>

      <!-- ราคา (badge) -->
      <span class="price-badge" id="foodPrice"></span>
    </section>

    <!-- ปุ่มสุ่มเมนู -->
    <button class="btn-random" id="randomBtn" type="button">
      🎲 สุ่มเมนูอาหาร
    </button>
  </main>

  <!-- ไฟล์ JavaScript -->
  <script src="script.js"></script>
</body>
</html>
